name: Deploy static WebGIS to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Sentinel L2A automatic download"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publication:
    name: Decide whether Sentinel changed published products
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      proceed: ${{ steps.decision.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact triggering run and published product fingerprints
        id: decision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sentinel_publication.py

  geospatial:
    needs: publication
    if: needs.publication.outputs.proceed == 'true'
    name: Geospatial regressions including PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gdal python3-numpy
          /usr/bin/python3 -m unittest discover -s scripts -p 'test_*.py'
  gate:
    needs: publication
    if: needs.publication.outputs.proceed == 'true'
    name: WebGIS offline gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local regressions
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_webgis.py
          node scripts/test-sentinel-ui.cjs
          node scripts/test-parcels.cjs
          node scripts/test-parcel-ndvi.cjs
          node scripts/test-water.cjs
          node scripts/test-comparison.cjs
          python3 scripts/build-location-policy.py --check
          node scripts/test-location.cjs
          node scripts/test-incidents-form.cjs
          node scripts/test-incidents.cjs
          node scripts/test-incidents-map.cjs

  wordpress:
    needs: publication
    if: needs.publication.outputs.proceed == 'true'
    name: WordPress incidents integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --prefix artifacts/qa @wp-playground/cli@3.1.61 fake-indexeddb@6.2.6
      - run: python3 scripts/package-incidents.py
      - run: node scripts/test-drafts.cjs
      - run: node scripts/verify-wordpress.mjs
      - name: Plugin package
        uses: actions/upload-artifact@v4
        with:
          name: castrejon-averias-1.1.0
          path: artifacts/castrejon-averias-1.1.0.zip
          retention-days: 14

  deploy:
    needs: [publication, gate, wordpress, geospatial]
    if: needs.publication.outputs.proceed == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Empty calendar runs never enter (or replace a pending run in) this queue.
    concurrency:
      group: sentinel-resources
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recheck published products after waiting for deployment
        id: current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sentinel_publication.py
      - name: Setup Pages
        if: steps.current.outputs.proceed == 'true'
        uses: actions/configure-pages@v5
      - name: Collect compatible Sentinel acquisitions by observation date
        if: steps.current.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sentinel_resources.py collect python3 scripts/collect_sentinel_products.py
      - name: Install geospatial runtime
        if: steps.current.outputs.proceed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gdal python3-numpy
      - name: Stage public files
        if: steps.current.outputs.proceed == 'true'
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          mkdir -p _site/averias
          cp averias/shared.js averias/map-layer.js averias/map-layer.css _site/averias/
          mkdir -p _site/data
          cp -r data/parcels _site/data/
          /usr/bin/python3 scripts/test_sentinel_web.py
          /usr/bin/python3 scripts/test_parcel_ndvi.py
          /usr/bin/python3 scripts/test_parcel_water.py
          /usr/bin/python3 scripts/test_parcel_comparison.py
          /usr/bin/python3 scripts/sentinel_resources.py upgrade /usr/bin/python3 scripts/upgrade_sentinel_products.py sentinel-products-v3 sentinel-products
          /usr/bin/python3 scripts/sentinel_resources.py build /usr/bin/python3 scripts/build_sentinel_web.py sentinel-products-v3 _site/sentinel --collection
          python3 scripts/sentinel_publication.py --record sentinel-products _site/sentinel/catalog.json
          python3 scripts/sentinel_resources.py recovery python3 scripts/sentinel_recovery.py sentinel-products _site/sentinel/catalog.json _site
          python3 scripts/sentinel_stage.py
      - name: Admit independent Actions upload budget
        if: steps.current.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sentinel_remote_budget.py _site
      - name: Upload static site
        if: steps.current.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        if: steps.current.outputs.proceed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Resource measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-pages-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: sentinel-metrics.jsonl
          if-no-files-found: ignore
          retention-days: 7
