name: Deploy static WebGIS to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Sentinel L2A automatic download"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: WebGIS offline gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local regressions
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_webgis.py
          node scripts/test-sentinel-ui.cjs

  deploy:
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Find latest successful Sentinel product
        id: sentinel
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({owner, repo,
              workflow_id: 'sentinel.yml', branch: 'main', status: 'success', per_page: 100});
            for (const run of runs.data.workflow_runs) {
              if (run.head_repository?.full_name !== `${owner}/${repo}` ||
                  !['schedule', 'workflow_dispatch'].includes(run.event)) continue;
              const result = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: run.id});
              const artifact = result.data.artifacts.find(a => !a.expired && a.name === `sentinel-${run.id}`);
              if (artifact) { core.setOutput('run', String(run.id)); return; }
            }
            core.setFailed('No successful unexpired Sentinel product. Preserve the current deployment.');
      - name: Download validated workflow product
        uses: actions/download-artifact@v4
        with:
          name: sentinel-${{ steps.sentinel.outputs.run }}
          run-id: ${{ steps.sentinel.outputs.run }}
          github-token: ${{ github.token }}
          path: sentinel-product
      - name: Install geospatial runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gdal python3-numpy
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          /usr/bin/python3 scripts/test_sentinel_web.py
          /usr/bin/python3 scripts/build_sentinel_web.py sentinel-product _site/sentinel
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
