name: Deploy static WebGIS to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Sentinel L2A automatic download"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: WebGIS offline gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local regressions
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_webgis.py
          node scripts/test-sentinel-ui.cjs
          node scripts/test-parcels.cjs
          node scripts/test-parcel-ndvi.cjs
          node scripts/test-water.cjs
          node scripts/test-comparison.cjs
          node scripts/test-incidents.cjs
          node scripts/test-incidents-map.cjs

  wordpress:
    name: WordPress incidents integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --prefix artifacts/qa @wp-playground/cli@3.1.61 fake-indexeddb@6.2.6
      - run: python3 scripts/package-incidents.py
      - run: node scripts/test-drafts.cjs
      - run: node scripts/verify-wordpress.mjs

  deploy:
    needs: [gate, wordpress]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Collect two distinct validated Sentinel acquisitions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/collect_sentinel_products.py
      - name: Install geospatial runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gdal python3-numpy
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          mkdir -p _site/averias
          cp averias/shared.js averias/map-layer.js averias/map-layer.css _site/averias/
          mkdir -p _site/data
          cp -r data/parcels _site/data/
          /usr/bin/python3 scripts/test_sentinel_web.py
          /usr/bin/python3 scripts/test_parcel_ndvi.py
          /usr/bin/python3 scripts/test_parcel_water.py
          /usr/bin/python3 scripts/test_parcel_comparison.py
          /usr/bin/python3 scripts/build_sentinel_web.py sentinel-products _site/sentinel --collection
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
