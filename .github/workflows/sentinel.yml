name: M4 original bands for local validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m4-original-bands-20261014
  cancel-in-progress: false

jobs:
  download:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/m4-originales-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install existing geospatial runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gdal
      - name: Download and verify ten original JP2 files
        env:
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
        run: /usr/bin/python3 scripts/download_m4_originals.py
      - name: Save verified originals for local processing
        uses: actions/upload-artifact@v4
        with:
          name: m4-original-bands-${{ github.run_id }}
          path: m4-original-bands/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
